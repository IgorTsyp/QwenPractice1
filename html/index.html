<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План поездки</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .width500 {
    height: 500px;
    }

    </style>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8">

        <!-- Заголовок -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                План поездки
            </h1>

            <p class="text-gray-500">
                Введите страну и продолжительность поездки
            </p>
        </div>

        <!-- Статус -->
        <p id="statustxt" class="text-center text-gray-500 mb-6">
            ...
        </p>

        <!-- Форма -->
        <form id="form" class="space-y-6">

            <!-- Страна -->
            <div>
                <label for="country" class="block text-sm font-medium text-gray-700 mb-2">
                    Введите название страны
                </label>

                <input id="country" type="text" placeholder="Например: Италия" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500 transition">
            </div>

            <!-- Продолжительность -->
            <div>
                <label for="triplength" class="block text-sm font-medium text-gray-700 mb-2">
                    Продолжительность поездки (дни)
                </label>

                <input id="triplength" type="number" min="1" placeholder="Например: 5" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500 transition">
            </div>
            
             <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Free<input id="price1" name="price" type="radio" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500 transition">
                </label>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Paid<input id="price2" name="price" type="radio" class="w-full px-4 py-3 border border-gray-300 rounded-lg
                            focus:outline-none focus:ring-2 focus:ring-blue-500
                            focus:border-blue-500 transition">
                </label>
            </div>

            <!-- Кнопка -->
            <button id="button" type="submit" class="w-full bg-blue-600 text-white font-semibold
                       py-3 px-4 rounded-lg
                       hover:bg-blue-700
                       active:bg-blue-800
                       disabled:bg-gray-400
                       transition duration-200
                       cursor-pointer">
                Составить план поездки
            </button>

        </form>

        <!-- Результат -->
        <div class="mt-8">

            <h2 class="text-xl font-semibold text-gray-800 mb-4">
                Ваш план поездки
            </h2>

            <div class="bg-gray-50 border border-gray-200 rounded-lg p-5">

                <pre id="qwenmes" class="whitespace-pre-wrap text-gray-700
                           text-sm leading-7 font-sans"></pre>

            </div>

        </div>

    </div>

    <div id="map" class="h-96 w-full rounded-lg border border-gray-200"></div>

    <script>
        let map = L.map("map").setView([20, 0], 2);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap"
        }).addTo(map)

        let markers = L.layerGroup().addTo(map)

        async function geocode(place, country) {
            let url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
                + encodeURIComponent(place + ", " + country)
            let res = await fetch(url, { headers: { "Accept-Language": "ru" } })
            let found = await res.json()
            if (found.length === 0) return null       // место не нашлось
            return { lat: +found[0].lat, lon: +found[0].lon }
        }

        // async function test() {
        //         let result = await geocode("Burj Khalifa", countryName);
        //         console.log(result);
        //     }

        //     test();

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
    </script>


    <script>
        let form = document.querySelector("#form")
        let button = document.querySelector("#button")
        let statustxt = document.querySelector("#statustxt")

        form.addEventListener("submit", async function (event) {
            event.preventDefault()

            button.disabled = true
            statustxt.textContent = "запрос обрабатывается..."

            let countryName = document.querySelector("#country").value
            let triplen = document.querySelector("#triplength").value
            let price1 = document.querySelector("#price1").checked;
            let price2 = document.querySelector("#price2").checked;
            let budget = ""
            if (price1) {
                console.log("Выбрана первая кнопка")
                budget = "free"
            } else if (price2) {
                console.log("Выбрана вторая кнопка")
                budget = "paid"
            }
            

            let formData = {
                "country": countryName,
                "triplength": triplen,
                "budget" : budget
            }

            let data = await fetch("/api/qwen1", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })

            let answer = await data.json()
            let plan = JSON.parse(answer.qwenData)


            let pre = document.querySelector("#qwenmes")

            pre.textContent = plan.days.map((day) =>
                `День ${day.day}
Утро: ${(day.morning ?? []).join(', ')}
День: ${(day.afternoon ?? []).join(', ')}
Вечер: ${(day.evening ?? []).join(', ')}`
            ).join('\n\n')
        statustxt.textContent = "Ищем ваше место..."
            markers.clearLayers()

            let points = []
            console.log(plan)

            //  async function test() {
            //     let result = await geocode("Burj Khalifa", countryName);
            //     console.log(result);
            // }

            // test();

            let all_places = []
            let coords = []
            for (let day of plan.days) {
                let places = [...day.morning, ...day.afternoon, ...day.evening]
                all_places.push(...places)
                // console.log(places)
            }
            console.log(all_places)
            let coords2 = []
            for (let place of all_places) {
                let result = await geocode(place, countryName);
                if (result) {
                    coords2.push({place:place, lat: result.lat, lon: result.lon}) 
                }
                await sleep(1000);
                console.log(place, countryName)
                
            }
            console.log(coords2)
            markers.clearLayers()
            for (let point of coords2) {
                L.marker([point.lat, point.lon])
                    .bindPopup(point.place)
                    .addTo(markers)
            }
            
            
            let bounds = L.latLngBounds(coords2.map((p) => [p.lat, p.lon]))
            map.fitBounds(bounds, { padding: [30, 30] })

            statustxt.textContent = 'Найдено мест' + coords2.length
            button.disabled = false
        })
            

    </script>


</body>

</html>
